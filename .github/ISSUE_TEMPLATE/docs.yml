name: "Docs / onboarding — I got stuck following the instructions"
description: "The docs are missing, wrong, or assume something you don't have. You do not need to be a programmer to file this."
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        **This is the most useful issue you can open here, and the least appreciated one.**

        If you got stuck, the docs are broken — not you. We can't see where a reader falls off,
        so telling us is the only way we learn it. No code, no repro script, no jargon required:
        plain words are fine, and so is another language.

        We answer within 48 hours.

  - type: input
    id: where
    attributes:
      label: Where you were
      description: The file, page or section — a link or a filename is enough.
      placeholder: "README.md, the Quickstart section"
    validations:
      required: true

  - type: textarea
    id: stuck
    attributes:
      label: What you were trying to do, and where it stopped working
      description: >
        Walk us through it in your own words: what you wanted, what you typed or clicked,
        and the point where it stopped making sense.
      placeholder: |
        I wanted to try it on my own notes. I followed the Quickstart to step 3, then it asked
        for something called an "embedding model" and I don't know where to get one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected the docs to say
      description: >
        Even a rough sentence helps. "It should have told me X before step 3" is a complete
        answer and often becomes the fix verbatim.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of gap is it
      description: Your best guess. If unsure, pick the last one.
      options:
        - "Missing — a step nobody wrote down"
        - "Wrong — the instruction no longer matches the code"
        - "Assumed — it expects knowledge or a tool I don't have"
        - "Unclear — it is technically correct but I could not follow it"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Your setup
      description: >
        Optional. OS and, if relevant, the version of the tool. Only matters if the docs
        broke because of your platform.
      placeholder: "Windows 11, no Python installed"
    validations:
      required: false

  - type: checkboxes
    id: offer
    attributes:
      label: Optional
      options:
        - label: >
            I'd be happy to write the fix myself once we agree what it should say.
          required: false
